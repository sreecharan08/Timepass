<html>
    <head>
        <title>Transform</title>
        <style>
            .Box{
                width:250px;
                height:300px;
                background-color:blue;
            }
            div{
                transform: translate(300px, 200px) skewY(245deg);
            }
        </style>
    </head>
    <body>
        <div class="Box">
            <p> Welcome</p>
        </div>
    </body>
</html>
