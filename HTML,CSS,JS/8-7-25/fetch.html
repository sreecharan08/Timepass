<html>
    <head>
        <title> Fetch </title>
    </head>
    <body>
        <script>
           fetch('https://jsonplaceholder.typicode.com/posts', {
  method: 'POST',
  body: JSON.stringify({
  id: 101,
  title: 'foo',
  body: 'bar',
  userId: 1
}),
  headers: {
    'Content-type': 'application/json; charset=UTF-8',
  },
})
  .then((response) => response.json())
  .then((json) => console.log(json));
        </script>
