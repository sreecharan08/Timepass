<html>
    <head>
        <title>Calculator </title>
    </head>
    <body>
            <script>
                let operator = prompt("Enter a operator(+,-,*,/): ");
                let num1 = Number(prompt("Enter 1st number: "));
                let num2 = Number(prompt("Enter 2nd number: "));
    
                switch(operator){
                    case "+" : document.write("Sum of "+num1+" and "+num2+" is "+(num1+num2));break;
                    case "-" : document.write("Difference of "+num1+" and "+num2+" is "+(num1-num2));break;
                    case "*" : document.write("Product of "+num1+" and "+num2+" is "+(num1*num2));break;
                    case "/" : document.write("division of "+num1+" and "+num2+" is "+(num1/num2));break;
                }
            </script>
        </body>
        </html>
