<html>
    <head>
        <title>Pattern</title>
    </head>
    <body>
        <script>
            for(i=0;i<=5;i++){
                for(j=0;j<=5;j++){
                    document.write("*")
                }
                document.writeln("<br>")
            }



            document.write("<hr>")
            for(let i=0; i<=5; i++){
                for(let j=1; j<=i; j++){
                    document.writeln("*");
                }
                document.writeln("<br>");
            }
            document.write("<hr>")
            for(let i=6; i>=1; i--){
                for(let j=1; j<=i; j++){
                    document.write("*")
                }
                document.write("<br>")
            }
            document.write("<hr>")
            
                        
        </script>
    </body>
</html>
