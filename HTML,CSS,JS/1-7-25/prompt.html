<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prompts</title>
</head>
<body>
    <h2> Employee details </h2>
    <script>
        let em_id = prompt("Enter Employee id");
        let em_name = prompt("Enter Employee name");
        let em_salary = prompt("Enter Employee salary");
        let em_add = prompt("Enter Employee address");

        document.write("-------------Employee details------------------<br>");
        document.write("Employee ID: " + em_id + "<br>");
        document.write("Employee Name: " + em_name + "<br>");
        document.write("Employee Salary: " + em_salary + "<br>");
        document.write("Employee Address: " + em_add + "<br>");
    </script>
</body>
</html>
