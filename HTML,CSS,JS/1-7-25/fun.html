<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FUNCTIONS</title>
</head>
<body>
<script>

document.write("<h3>=======named function===========</h3>")

function Greet()
{
    document.write("Welcome to function concept"+"<br>")
}
Greet();
Greet();
Greet();

document.write("<h4>===========Parameter function===========</h4>")
function Welcome(name)
{
    document.write("Hello..."+name+"<br>")
}
Welcome("hari");
Welcome("is a");
Welcome("wastefellow");

document.write("<h4>===========Written type function===========</h4>")
function Hello()
{
    return "Welcome to MRUH";
}
document.write(Hello())
Hello();
</script>
</body>
</html>
