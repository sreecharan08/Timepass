<html>
    <head>
        <title>Tables</title>
    </head>
    <body>
        <script>
            let tab = Number(prompt("Enter a table number: "));
            for(let i = 1; i <= 10; i++) {
                document.write(tab + " * " + i + " = " + (tab * i) + "<br>");
            }
            for(let i = 10; i >= 1; i--) {
                document.write(tab + " * " + i + " = " + (tab * i) + "<br>");
            }
        </script>
    </body>
</html>
