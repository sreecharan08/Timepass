<html>
    <head>
        <title> Add Numbers </title>
    </head>
    <body>
        <script>
            function addition(...numbers)
            {
            Let total=0
            for(Let num of numbers)
            {
            total+=num;
            }
            return total;
            
            }
            document.write("addition of values: "+addition (12,13))
            document.write("addition of values: "+addition (12,13,89,35))
            document.write("addition of values: "+addition (12,13,89, 23, 67, 38))
        </script>
    </body>
</html>
