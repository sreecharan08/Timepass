<html>
    <head>
        <title> Type conversion </title>
    
        
    </head>
    <body>
        <h3>1.implicit conversion</h3>
        <h3>explicait conversion</h3>

        <script>
            document.write("value is: "+(3*"2")+"<br>")
            document.write("value is: "+("3"+2)+"<br>")
            document.write("value is: "+(12/0)+"<br>")
            document.write("value is: "+(-12/0)+"<br>")
            document.write("value is: "+(true+1)+"<br>")
            document.write("value is: "+(false+1)+"<br>")
            document.write("value is: "+(false + false)+"<br>")
            document.write("<h2>Explicit conversion </h2>")
            document.write("string conversion is: " + String(1))

            document.write("Number conversion is: "+Number(123.9)+"<br>")
            document.write("Number conversion is: "+Number("345")+"<br>")
            document.write("Number conversion is: "+Number(undefined)+"<br>")
            document.write("Number conversion is: "+Number("sathya")+"<br>")
            document.write("Number conversion is: "+Number("null")+"<br>")
            document.write("Number conversion is: "+Number("true")+"<br>")
            document.write("Number conversion is: "+Number(true)+"<br>")
            document.write("Number conversion is: "+Number(false)+"<br>")
            document.write("Number conversion is: "+Number("")+"<br>")
        </script>
