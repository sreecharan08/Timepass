<!DOCTYPE html>
<html>
        <head>

        <title>Document</title>
        </head>
            <body>
                <script>
                    document.write("=======================string=========================<br>")
                    let name = "Hari"
                    let city = 'Kannur'
                    let age = 69;
                    document.write("My name is: " + name + "<br>")
                    document.write("My city is: " + city + "<br>")
                    document.write(`My age is: ${age}<br>`)
                    document.write("<hr>")
                    document.write("=======================Number=========================<br>")
                    let salary=35000
                    let bonus = 4554.34
                    let distance = 4.2e+3
                    document.write("My salary is: "+salary+"<br> ")
                    document.write("My bonus is: "+bonus+"<br> ")
                    document.write("distance is: "+distance+"<br> ")

                    document.write("=====object representation=======<br>")
                    const person={
                    name:"sensei",
                    age:20,
                    address: "saudi"
                    }
                    document.write("person detailes: "+person.name+"<br>")
                    document.write("person detailes: "+person.age)

                    document.write("=====Array representation======="+"<hr>")
                    const names=["welcome", "to", "india"]
                    document.write("values are: "+names+"<br>")
                    document.write("values index 0:"+names[0]+"<br>")
                    document.write("values index 1: "+names[1]+"<br>")
                    document.write("values index 2: "+names[2]+"<br>")

                    
                 
                </script>
            </body>
</html>
